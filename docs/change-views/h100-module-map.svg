   <g id="text_2">
    <text style="font-weight: 700; font-size: 11.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8c0000" x="51.48" y="115.776" transform="rotate(-0 51.48 115.776)">Reward service</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(51.48 152.470406)">4 CPU threads / worker</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(51.48 168.542419)">Colour crops loaded in-process</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(51.48 184.614431)">Same detector, CLIP and scoring</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 11.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8c0000" x="297" y="115.776" transform="rotate(-0 297 115.776)">Overlap and host path</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(297 152.470406)">Rewards behind packing + forwards</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(297 168.542419)">Latent scalars read once</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(297 184.614431)">Shared masks and frozen ViT</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 11.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8c0000" x="542.52" y="115.776" transform="rotate(-0 542.52 115.776)">Rollout scheduling</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(542.52 152.470406)">Pipelined text host bookkeeping</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(542.52 168.542419)">Reuse identical edit CFG prefix</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(542.52 184.614431)">Conditional graph-capture cleanup</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 11.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8c0000" x="51.48" y="284.616" transform="rotate(-0 51.48 284.616)">Text decode / prefill</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(51.48 321.310406)">Residual add + RMSNorm</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(51.48 337.382419)">Q/K norm + RoPE; SiLU × up</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(51.48 353.454431)">Concurrent small projections</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 11.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8c0000" x="297" y="284.616" transform="rotate(-0 297 284.616)">Image flow</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(297 321.310406)">Norm + expert-order restoration</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(297 337.382419)">K/V direct to merged cache</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(297 353.454431)">Early per-branch graph capture</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 11.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8c0000" x="542.52" y="284.616" transform="rotate(-0 542.52 284.616)">Training forward / backward</text>
   </g>
   <g id="text_13">
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(542.52 321.310406)">Fused norm, SwiGLU and RoPE</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(542.52 337.382419)">Split expert residual streams</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(542.52 353.454431)">Skip inactive CFG-row GEMMs</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #79696b" x="39.6" y="451.044" transform="rotate(-0 39.6 451.044)">Same measured arithmetic, reduction order and RNG consumption; FP32 main weights / Adam, BF16 compute.</text>
   </g>
   <g id="text_15">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #79696b" x="39.6" y="470.34" transform="rotate(-0 39.6 470.34)">Validated on eight H100 GPUs for 14 deterministic steps. Kernel exactness is tied to the tested PyTorch / Triton versions.</text>
   </g>
