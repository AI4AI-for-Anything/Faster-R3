   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #292122" x="44.712" y="311.3856" transform="rotate(-0 44.712 311.3856)">Image flow (denoising)</text>
   </g>
   <g id="text_15">
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(44.712 344.595206)">Timesteps built on the GPU</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(44.712 359.117137)">MoT tokens kept in expert order</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(44.712 373.639069)">Backbones replayed, CFG branches concurrent</text>
   </g>
   <g id="text_16">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #79696b" transform="translate(44.712 410.689812)">modeling/bagel/bagel.py</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #79696b" transform="translate(44.712 423.088969)">modeling/bagel/qwen2_navit.py</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #79696b" transform="translate(44.712 435.744)">modeling/bagel/static_flow_graph.py</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8c0000" x="339.552" y="288.864" transform="rotate(-0 339.552 288.864)">04</text>
