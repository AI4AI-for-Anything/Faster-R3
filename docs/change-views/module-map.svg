   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #292122" x="44.712" y="105.7536" transform="rotate(-0 44.712 105.7536)">Static KV-cache metadata</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(44.712 138.963206)">Lengths read from the GPU once per forward</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(44.712 153.485138)">Packing indexes reused across layers</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(44.712 168.007069)">Capacity proven once per decoding call</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #79696b" transform="translate(44.712 204.801937)">modeling/bagel/qwen2_navit.py</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #79696b" transform="translate(44.712 217.456969)">modeling/bagel/static_text_graph.py</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #79696b" transform="translate(44.712 230.112)">train/rollout_controller.py</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8c0000" x="339.552" y="83.232" transform="rotate(-0 339.552 83.232)">02</text>
   </g>
