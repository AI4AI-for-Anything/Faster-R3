   </g>
   <g id="text_10">
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(339.552 138.963206)">Backbone replayed as a CUDA graph</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(339.552 153.485138)">LM head and sampler replayed, same RNG</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(339.552 168.007069)">One host read per token batch</text>
   </g>
   <g id="text_11">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #79696b" transform="translate(339.552 205.057812)">modeling/bagel/bagel.py</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #79696b" transform="translate(339.552 217.456969)">modeling/bagel/static_text_graph.py</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #79696b" transform="translate(339.552 230.112)">modeling/bagel/static_text_sampling_graph.py</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8c0000" x="44.712" y="288.864" transform="rotate(-0 44.712 288.864)">03</text>
