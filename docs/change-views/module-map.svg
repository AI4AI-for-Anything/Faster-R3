   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #292122" x="339.552" y="311.3856" transform="rotate(-0 339.552 311.3856)">Training-step memory</text>
   </g>
   <g id="text_20">
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(339.552 344.595206)">Full KL-reference weights resharded</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(339.552 359.117137)">after the reference forward,</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(339.552 373.639069)">before the policy forward and backward</text>
   </g>
   <g id="text_21">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #79696b" x="339.552" y="435.744" transform="rotate(-0 339.552 435.744)">train/online_rl.py</text>
   </g>
   <g id="text_22">
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #79696b" transform="translate(35.64 470.918325)">7 files: 3 new, 4 upstream files edited. There are no switches: the changes are always on. The CUDA-graph and expert-order</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #79696b" transform="translate(35.64 482.7456)">paths fall back to the upstream code when their preconditions do not hold.</text>
   </g>
